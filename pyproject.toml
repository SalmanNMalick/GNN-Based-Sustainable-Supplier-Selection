[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supplier-gnn"
version = "1.0.0"
description = "GNN-based multi-criteria supplier selection with net-zero alignment"
authors = [{ name = "Salman Nawaz Malik" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
include = ["supplier_gnn*"]
